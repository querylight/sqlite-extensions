name: Check upstream releases

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly Monday 6am UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      # GitHub disables scheduled workflows after 60 days without repo activity
      - name: Keep schedule enabled
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/check-upstream.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/checkout@v7

      - name: Check for updates
        run: bash scripts/update-manifest.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          title: "chore: update extension versions"
          commit-message: "chore: update manifest with latest upstream releases"
          branch: auto-update-manifest
          body: |
            Automated update — upstream extensions have new releases.
            Review the manifest diff before merging.
